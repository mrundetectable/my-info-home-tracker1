<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f4">
  <meta name="description" content="A simple offline tracker for your YouTube channel videos.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <title>My Info Home tracker</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7f4;--surface:#fff;--surface2:#eef2ed;--text:#17221b;--muted:#657168;--line:#dce4dc;--accent:#176b43;--accent-soft:#e2f1e8;--amber:#98600b;--amber-soft:#fff0d2;--danger:#b42318;--shadow:0 2px 10px rgba(20,40,25,.045)}
    @media(prefers-color-scheme:dark){:root{--bg:#111713;--surface:#1a231d;--surface2:#222e26;--text:#edf4ee;--muted:#a4b1a7;--line:#344238;--accent:#8bd5a9;--accent-soft:#243d2e;--amber:#f1c16e;--amber-soft:#40331e;--danger:#ff8c82;--shadow:0 2px 12px rgba(0,0,0,.15)}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Telugu","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
    .wrap{width:min(100%,620px);margin:0 auto;padding:22px 16px calc(36px + env(safe-area-inset-bottom))}
    header{padding:8px 2px 20px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-logo{width:62px;height:62px;object-fit:contain;border-radius:14px;flex:0 0 62px}
    h1{font-size:21px;line-height:1.2;letter-spacing:-.5px;margin:0 0 7px;font-weight:750}
    .summary{margin:0;color:var(--muted);font-size:14px}
    section{margin:0 0 22px}
    .section-title{font-size:15px;font-weight:700;margin:0 0 11px}
    .panel,.video-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .panel{padding:15px}
    label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px}
    input,select,button{font:inherit}
    input[type=text],input[type=date],select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--text);font-size:15px;outline:none}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
    .field{margin-bottom:13px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .segmented{display:flex;gap:7px}
    .segmented button,.chip{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:var(--surface2);color:var(--text);font-weight:650;font-size:14px;flex:1}
    .segmented button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .btn{min-height:46px;border:0;border-radius:11px;padding:10px 15px;font-weight:700;font-size:15px;cursor:pointer}
    .primary{background:var(--accent);color:#fff}
    @media(prefers-color-scheme:dark){.primary{color:#102016}}
    .secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
    .danger{color:var(--danger);background:transparent;border:1px solid var(--line)}
    .add-btn{width:100%;margin-top:2px}
    .filters{display:flex;gap:8px;margin:0 0 13px;overflow-x:auto;padding-bottom:2px}
    .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 12px}
    .toolbar input,.toolbar select{min-width:0}
    .view-toggle{display:flex;gap:7px;margin:0 0 12px}
    .view-toggle button{flex:1}
    .overdue{color:var(--danger);font-weight:750}
    .details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
    .details summary{font-size:13px;font-weight:750;color:var(--accent);cursor:pointer;min-height:36px;display:flex;align-items:center}
    .detail-grid{display:grid;gap:9px;margin-top:8px}
    .detail-grid label{margin-bottom:4px}
    .detail-grid input,.detail-grid textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
    .detail-grid textarea{min-height:76px;resize:vertical}
    .calendar-day{font-size:13px;font-weight:750;color:var(--muted);margin:12px 2px 7px}
    .calendar-item{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);margin-bottom:7px}
    .calendar-item strong{font-size:14px;overflow-wrap:anywhere}
    .calendar-item small{color:var(--muted);white-space:nowrap}
    .calendar-empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
    .chip{flex:0 0 auto;min-width:64px;border-radius:999px;min-height:39px}
    .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .video-list{display:flex;flex-direction:column;gap:11px}
    .video-card{padding:14px}
    .video-card.uploaded{opacity:.72}
    .card-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
    .topic{font-size:16px;font-weight:750;line-height:1.35;overflow-wrap:anywhere;margin:1px 0 7px}
    .tag-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .tag,.example,.status-pill{font-size:11px;font-weight:750;padding:4px 8px;border-radius:999px;white-space:nowrap}
    .tag.long{background:var(--accent-soft);color:var(--accent)}
    .tag.short{background:var(--amber-soft);color:var(--amber)}
    .example{background:var(--surface2);color:var(--muted);font-weight:650}
    .status-pill{background:var(--surface2);color:var(--muted);display:inline-block}
    .status-pill.scheduled{background:var(--amber-soft);color:var(--amber)}
    .status-pill.uploaded{background:var(--accent-soft);color:var(--accent)}
    .stage-line{display:flex;justify-content:space-between;gap:8px;margin:14px 0 8px;font-size:13px}
    .stage-line strong{font-weight:700}
    .stage-line span{color:var(--muted);white-space:nowrap}
    .progress{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:12px}
    .progress i{height:6px;border-radius:6px;background:var(--surface2);display:block}
    .progress i.done{background:var(--accent)}
    .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
    .date-text{font-size:12px;color:var(--muted)}
    .card-actions{display:grid;grid-template-columns:1fr;gap:8px}
    .card-actions .btn{width:100%}
    .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .edit-grid select,.edit-grid input{min-width:0;min-height:44px;font-size:13px;padding:8px}
    .delete-row{display:flex;justify-content:flex-end}
    .delete-row .btn{min-height:40px;padding:7px 12px;font-size:13px}
    .empty{padding:23px 15px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px}
    .account-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .account-copy{min-width:0;flex:1}
    .account-title{font-weight:750;font-size:14px;margin:0 0 3px}
    .account-state{font-size:12px;color:var(--muted);margin:0;overflow-wrap:anywhere}
    .account-actions{display:flex;gap:8px;flex-wrap:wrap}
    .account-actions .btn{min-height:44px}
    .email-auth{display:grid;grid-template-columns:1fr;gap:9px;width:100%;margin-top:12px}
    .email-auth input{width:100%;min-height:46px}
    .email-auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .email-auth-actions .btn{min-height:46px}
    .auth-note{font-size:12px;color:var(--muted);margin:0}
    .sync-good{color:var(--accent)}
    .sync-warn{color:var(--amber)}
    .hidden{display:none!important}
    footer{font-size:12px;color:var(--muted);text-align:center;padding:8px 0}
    @media(min-width:500px){.wrap{padding-left:20px;padding-right:20px}.panel{padding:17px}.video-card{padding:16px}}
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">
      <img class="brand-logo" src="./logo.png" alt="My Info Home logo">
      <div>
        <h1>My Info Home tracker</h1>
        <p class="summary" id="summary">0 in progress · 0 scheduled · 0 uploaded</p>
      </div>
    </div>
  </header>

  <section aria-label="Cloud account">
    <div class="panel account-panel">
      <div class="account-copy">
        <p class="account-title" id="account-title">Cloud sync not connected</p>
        <p class="account-state" id="account-state">Create an account or sign in to sync your videos across devices.</p>
      </div>
      <div class="account-actions">
        <button class="btn secondary" id="signin-btn" type="button">Sign in with Google</button>
        <button class="btn secondary hidden" id="signout-btn" type="button">Sign out</button>
      </div>
      <div class="email-auth" id="email-auth">
        <input id="email-address" type="email" autocomplete="email" placeholder="Email address" aria-label="Email address">
        <input id="email-password" type="password" autocomplete="current-password" minlength="6" placeholder="Password (at least 6 characters)" aria-label="Password">
        <div class="email-auth-actions">
          <button class="btn primary" id="email-signin-btn" type="button">Sign in</button>
          <button class="btn secondary" id="email-signup-btn" type="button">Create account</button>
        </div>
        <button class="btn secondary" id="reset-password-btn" type="button">Forgot password?</button>
        <p class="auth-note">Your videos are private to your account. Use the same email and password on each device.</p>
      </div>
    </div>
  </section>

  <section aria-labelledby="add-title">
    <h2 class="section-title" id="add-title">Add a video</h2>
    <form class="panel" id="add-form">
      <div class="field">
        <label for="topic">Topic name</label>
        <input id="topic" name="topic" type="text" maxlength="180" placeholder="వీడియో topic name" required>
      </div>
      <div class="two">
        <div class="field">
          <label>Length</label>
          <div class="segmented" role="group" aria-label="Video length">
            <button type="button" data-length="Long" aria-pressed="false">Long</button>
            <button type="button" data-length="Short" aria-pressed="true">Short</button>
          </div>
        </div>
        <div class="field">
          <label for="stage">Current stage</label>
          <select id="stage"></select>
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="status">Status</label>
          <select id="status"><option>Not yet</option><option>Scheduled</option><option>Uploaded</option></select>
        </div>
        <div class="field">
          <label for="date">Upload date (optional)</label>
          <input id="date" type="date">
        </div>
      </div>
      <button class="btn primary add-btn" type="submit">Add topic</button>
    </form>
  </section>

  <section aria-label="Videos">
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search topics…" aria-label="Search topics">
      <select id="stage-filter" aria-label="Filter by stage"><option value="All">All stages</option></select>
      <select id="status-filter" aria-label="Filter by status"><option value="All">All statuses</option><option>Not yet</option><option>Scheduled</option><option>Uploaded</option></select>
      <select id="sort-order" aria-label="Sort videos"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="date">Upload date</option></select>
    </div>
    <div class="filters" role="group" aria-label="Filter videos">
      <button class="chip active" data-filter="All" aria-pressed="true">All</button>
      <button class="chip" data-filter="Long" aria-pressed="false">Long</button>
      <button class="chip" data-filter="Short" aria-pressed="false">Short</button>
    </div>
    <div class="view-toggle" role="group" aria-label="Video display">
      <button class="btn secondary" id="list-view" aria-pressed="true">List view</button>
      <button class="btn secondary" id="calendar-view" aria-pressed="false">Calendar view</button>
    </div>
    <div class="video-list" id="video-list"></div>
  </section>

</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDocs, onSnapshot, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

(async () => {
  const firebaseConfig = {
    apiKey: "AIzaSyB0g5q7CNdzodQVfQrSKP--A93OM5ej7gk",
    authDomain: "my-info-home-tracker1.firebaseapp.com",
    projectId: "my-info-home-tracker1",
    storageBucket: "my-info-home-tracker1.firebasestorage.app",
    messagingSenderId: "181261546355",
    appId: "1:181261546355:web:e4aa36873d0ecaa9d74b06",
    measurementId: "G-EKHFS68338"
  };

  const STAGES = ["Topic","5-Rule","Scripting","Voice over","Footage","Edit","SEO","Upload"];
  const KEY = "channel-tracker-v1";
  const $ = s => document.querySelector(s);
  const listEl = $("#video-list");
  let videos = [];
  let filter = "All";
  let viewMode = "list";
  let selectedLength = "Short";
  let auth, db, currentUser = null, cloudIds = new Set(), unsubscribeVideos = null;
  let loadingCloud = false, syncBusy = false, syncAgain = false;

  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const fmtDate = value => {
    if (!value) return "";
    const [y,m,d] = value.split("-").map(Number);
    return new Date(y,m-1,d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
  const examples = () => [
    {id:"example-1",topic:"ఎండను చూడగానే తుమ్ము ఎందుకు వస్తుంది?",length:"Short",stage:2,status:"Not yet",date:"",createdAt:Date.now()-2000,example:true},
    {id:"example-2",topic:"Why do airplane windows have tiny holes?",length:"Short",stage:4,status:"Scheduled",date:"2026-11-12",createdAt:Date.now()-1000,example:true},
    {id:"example-3",topic:"Japan car sticker — Koreisha mark",length:"Long",stage:6,status:"Uploaded",date:"2026-11-06",createdAt:Date.now(),example:true}
  ];
  function validVideo(v) {
    return v && typeof v.topic==="string" && ["Long","Short"].includes(v.length) &&
      Number.isInteger(v.stage) && v.stage>=0 && v.stage<8 &&
      ["Not yet","Scheduled","Uploaded"].includes(v.status) &&
      typeof v.date==="string" && typeof v.id==="string" &&
      v.id.length > 0 && !v.id.includes("/");
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw === null) { videos = examples(); localStorage.setItem(KEY,JSON.stringify(videos)); }
      else {
        const parsed = JSON.parse(raw);
        videos = Array.isArray(parsed) ? parsed.filter(validVideo).map(v=>({...v,example:!!v.example})) : examples();
      }
    } catch { videos = examples(); }
  }
  function saveLocal(){ localStorage.setItem(KEY,JSON.stringify(videos)); }
  function stageOptions(selected) {
    return STAGES.map((s,i)=>`<option value="${i}" ${i===selected?"selected":""}>${s}</option>`).join("");
  }
  function statusOptions(selected) {
    return ["Not yet","Scheduled","Uploaded"].map(s=>`<option ${s===selected?"selected":""}>${s}</option>`).join("");
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function setAccount(title, state, tone="") {
    $("#account-title").textContent = title;
    $("#account-state").textContent = state;
    $("#account-state").className = `account-state ${tone}`;
  }
  function render() {
    const inProgress = videos.filter(v=>v.status==="Not yet").length;
    const scheduled = videos.filter(v=>v.status==="Scheduled").length;
    const uploaded = videos.filter(v=>v.status==="Uploaded").length;
    $("#summary").textContent = `${inProgress} in progress · ${scheduled} scheduled · ${uploaded} uploaded`;
    const query = $("#search").value.trim().toLocaleLowerCase();
    const stageFilter = $("#stage-filter").value;
    const statusFilter = $("#status-filter").value;
    const sortOrder = $("#sort-order").value;
    const visible = videos.filter(v=>(filter==="All"||v.length===filter)
      && (stageFilter==="All"||String(v.stage)===stageFilter)
      && (statusFilter==="All"||v.status===statusFilter)
      && (!query||v.topic.toLocaleLowerCase().includes(query)||String(v.notes||"").toLocaleLowerCase().includes(query)))
      .sort((a,b)=>sortOrder==="oldest"?(a.createdAt||0)-(b.createdAt||0)
        :sortOrder==="date"?(a.date||"9999").localeCompare(b.date||"9999")
        :(a.status==="Uploaded")-(b.status==="Uploaded") || (b.createdAt||0)-(a.createdAt||0));
    if (!visible.length) { listEl.innerHTML='<div class="empty">No matching videos found.</div>'; return; }
    if (viewMode==="calendar") {
      const dated = visible.filter(v=>v.date).sort((a,b)=>a.date.localeCompare(b.date));
      const undated = visible.filter(v=>!v.date);
      if (!dated.length) { listEl.innerHTML='<div class="calendar-empty">No videos have an upload date yet.</div>'; return; }
      const groups = {};
      dated.forEach(v=>(groups[v.date] ||= []).push(v));
      listEl.innerHTML = Object.entries(groups).map(([date,items])=>
        `<div class="calendar-day">${esc(fmtDate(date))}</div>` + items.map(v=>
          `<div class="calendar-item"><strong>${esc(v.topic)}</strong><small>${esc(v.length)} · ${esc(v.status)}</small></div>`).join("")
      ).join("") + (undated.length?`<div class="calendar-day">No upload date</div>`+undated.map(v=>`<div class="calendar-item"><strong>${esc(v.topic)}</strong><small>${esc(v.length)} · ${esc(v.status)}</small></div>`).join(""):"");
      return;
    }
    listEl.innerHTML = visible.map(v=>{
      const stage=STAGES[v.stage], count=v.stage+1, isLast=v.stage===7;
      const progress=STAGES.map((_,i)=>`<i class="${i<=v.stage?"done":""}"></i>`).join("");
      const statusClass=v.status==="Uploaded"?"uploaded":v.status==="Scheduled"?"scheduled":"";
      const isOverdue=v.status==="Scheduled"&&v.date&&v.date<todayISO();
      const dateText=v.date?`· ${fmtDate(v.date)}`:"";
      const nextLabel=isLast?"Mark uploaded":`Next: ${STAGES[v.stage+1]}`;
      const nextDisabled=isLast&&v.status==="Uploaded";
      return `<article class="video-card ${v.status==="Uploaded"?"uploaded":""}" data-id="${esc(v.id)}">
        <div class="card-top"><div>
          <div class="topic">${esc(v.topic)}</div>
          <div class="tag-row"><span class="tag ${v.length.toLowerCase()}">${v.length}</span>${v.example?'<span class="example">Example</span>':""}</div>
        </div></div>
        <div class="stage-line"><strong>${esc(stage)}</strong><span>${count} of 8</span></div>
        <div class="progress" aria-label="${count} of 8 stages complete">${progress}</div>
        <div class="meta"><span class="status-pill ${statusClass}">${esc(v.status)}</span><span class="date-text ${isOverdue?"overdue":""}">${isOverdue?"Overdue · ":""}${dateText}</span></div>
        <details class="details">
          <summary>Video details & notes</summary>
          <div class="detail-grid">
            <div><label>Research notes</label><textarea class="notes-edit" placeholder="Facts, sources to verify, hook ideas…">${esc(v.notes||"")}</textarea></div>
            <div><label>Script link</label><input class="script-url-edit" type="url" placeholder="https://…" value="${esc(v.scriptUrl||"")}"></div>
            <div><label>Research link</label><input class="research-url-edit" type="url" placeholder="https://…" value="${esc(v.researchUrl||"")}"></div>
            <div><label>Footage link</label><input class="footage-url-edit" type="url" placeholder="https://…" value="${esc(v.footageUrl||"")}"></div>
          </div>
        </details>
        <div class="card-actions">
          <button class="btn primary next-btn" type="button" ${nextDisabled?"disabled":""}>${nextLabel}</button>
          <div class="edit-grid">
            <select class="stage-edit" aria-label="Jump to stage">${stageOptions(v.stage)}</select>
            <select class="status-edit" aria-label="Edit status">${statusOptions(v.status)}</select>
            <input class="date-edit" type="date" aria-label="Edit upload date" value="${esc(v.date)}">
            <button class="btn secondary delete-btn" type="button">Delete</button>
          </div>
        </div>
      </article>`;
    }).join("");
  }

  async function syncAll() {
    if (!currentUser || loadingCloud) return;
    if (syncBusy) { syncAgain = true; return; }
    syncBusy = true;
    try {
      const col = collection(db, "users", currentUser.uid, "videos");
      const localIds = new Set(videos.map(v=>v.id));
      const writes = videos.map(v=>setDoc(doc(col,v.id), v));
      const deletes = [...cloudIds].filter(id=>!localIds.has(id)).map(id=>deleteDoc(doc(col,id)));
      await Promise.all([...writes,...deletes]);
      cloudIds = localIds;
      setAccount(`Signed in as ${currentUser.email || "Google account"}`, "All changes synced to your Firebase account.", "sync-good");
    } catch (err) {
      console.error(err);
      setAccount(`Signed in as ${currentUser?.email || "Google account"}`, "Sync is waiting for a connection. Keep the app installed; pending changes will retry.", "sync-warn");
    } finally {
      syncBusy = false;
      if (syncAgain) { syncAgain = false; syncAll(); }
    }
  }

  async function connectUser(user) {
    currentUser = user;
    if (unsubscribeVideos) { unsubscribeVideos(); unsubscribeVideos = null; }
    if (!user) {
      cloudIds = new Set();
      $("#signin-btn").classList.remove("hidden");
      $("#signout-btn").classList.add("hidden");
      setAccount("Cloud sync not connected", "Create an account or sign in with email and password. Google sign-in is optional.");
      $("#email-auth").classList.remove("hidden");
      return;
    }
    $("#signin-btn").classList.add("hidden");
    $("#email-auth").classList.add("hidden");
    $("#signout-btn").classList.remove("hidden");
    setAccount("Connecting your private tracker…", "Checking your cloud records.");
    loadingCloud = true;
    try {
      const col = collection(db, "users", user.uid, "videos");
      const remote = await getDocs(col);
      if (remote.empty) {
        // First sign-in: migrate the current device's records to this account.
        const localCopy = [...videos];
        await Promise.all(localCopy.map(v=>setDoc(doc(col,v.id),v)));
        cloudIds = new Set(localCopy.map(v=>v.id));
      } else {
        // The cloud is authoritative when it already contains records.
        videos = remote.docs.map(d=>({...d.data(),id:d.id})).filter(validVideo);
        cloudIds = new Set(videos.map(v=>v.id));
        saveLocal();
      }
    } catch (err) {
      console.error(err);
      setAccount("Signed in — offline mode", "Cloud records may take a moment to load when your connection returns.", "sync-warn");
    } finally {
      loadingCloud = false;
      render();
    }
    unsubscribeVideos = onSnapshot(collection(db,"users",user.uid,"videos"), snap=>{
      const incoming = snap.docs.map(d=>({...d.data(),id:d.id})).filter(validVideo);
      const incomingIds = new Set(incoming.map(v=>v.id));
      cloudIds = incomingIds;
      const before = JSON.stringify(videos);
      const after = JSON.stringify(incoming);
      if (before !== after) {
        videos = incoming;
        saveLocal();
        render();
      }
      setAccount(`Signed in as ${user.email || "Google account"}`, snap.metadata.hasPendingWrites ? "Saving offline changes…" : "Cloud sync is active.", "sync-good");
    }, err=>{
      console.error(err);
      setAccount("Cloud connection issue", "Your local copy is still available. Check your connection and sign in again.", "sync-warn");
    });
  }

  function update(id, patch) {
    const v=videos.find(x=>x.id===id); if(!v)return;
    Object.assign(v,patch); saveLocal(); render(); syncAll();
  }

  STAGES.forEach((s,i)=>{$("#stage").add(new Option(s,i));$("#stage-filter").add(new Option(s,s=== "Topic"?"0":String(i)));});
  document.querySelectorAll("[data-length]").forEach(btn=>btn.addEventListener("click",()=>{
    selectedLength=btn.dataset.length;
    document.querySelectorAll("[data-length]").forEach(b=>b.setAttribute("aria-pressed",String(b===btn)));
  }));
  document.querySelectorAll("[data-filter]").forEach(btn=>btn.addEventListener("click",()=>{
    filter=btn.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b=>{b.classList.toggle("active",b===btn);b.setAttribute("aria-pressed",String(b===btn));});
    render();
  }));
  $("#add-form").addEventListener("submit",e=>{
    e.preventDefault();
    const topic=$("#topic").value.trim(); if(!topic)return;
    videos.push({id:uid(),topic,length:selectedLength,stage:Number($("#stage").value),status:$("#status").value,date:$("#date").value,createdAt:Date.now(),notes:"",scriptUrl:"",researchUrl:"",footageUrl:"",example:false});
    saveLocal(); render(); syncAll(); $("#add-form").reset(); $("#stage").value="0"; $("#status").value="Not yet";
    selectedLength="Short";
    document.querySelectorAll("[data-length]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.length==="Short")));
    $("#topic").focus();
  });
  ["search","stage-filter","status-filter","sort-order"].forEach(id=>$("#"+id).addEventListener(id==="search"?"input":"change",render));
  $("#list-view").addEventListener("click",()=>{viewMode="list";$("#list-view").setAttribute("aria-pressed","true");$("#calendar-view").setAttribute("aria-pressed","false");render();});
  $("#calendar-view").addEventListener("click",()=>{viewMode="calendar";$("#list-view").setAttribute("aria-pressed","false");$("#calendar-view").setAttribute("aria-pressed","true");render();});
  listEl.addEventListener("change",e=>{
    const card=e.target.closest("[data-id]"); if(!card)return;
    const id=card.dataset.id;
    if(e.target.matches(".stage-edit")) update(id,{stage:Number(e.target.value)});
    if(e.target.matches(".status-edit")) update(id,{status:e.target.value});
    if(e.target.matches(".date-edit")) update(id,{date:e.target.value});
    if(e.target.matches(".notes-edit")) update(id,{notes:e.target.value});
    if(e.target.matches(".script-url-edit")) update(id,{scriptUrl:e.target.value.trim()});
    if(e.target.matches(".research-url-edit")) update(id,{researchUrl:e.target.value.trim()});
    if(e.target.matches(".footage-url-edit")) update(id,{footageUrl:e.target.value.trim()});
  });
  listEl.addEventListener("click",e=>{
    const card=e.target.closest("[data-id]"); if(!card)return;
    const id=card.dataset.id, v=videos.find(x=>x.id===id); if(!v)return;
    if(e.target.matches(".next-btn")){
      if(v.stage===7){update(id,{status:"Uploaded",date:v.date||todayISO()});}
      else update(id,{stage:v.stage+1});
    }
    if(e.target.matches(".delete-btn")){
      if(e.target.dataset.confirm==="yes"){
        videos=videos.filter(x=>x.id!==id); saveLocal(); render(); syncAll();
      } else {
        e.target.dataset.confirm="yes"; e.target.textContent="Tap again to delete";
        e.target.classList.add("danger");
        setTimeout(()=>{const current=card.querySelector(".delete-btn");if(current&&current.dataset.confirm==="yes"){current.dataset.confirm="";current.textContent="Delete";current.classList.remove("danger");}},3500);
      }
    }
  });
  async function emailAuth(action) {
    const email = $("#email-address").value.trim();
    const password = $("#email-password").value;
    if (!email || !password) { alert("Enter your email address and password."); return; }
    if (password.length < 6) { alert("Password must be at least 6 characters."); return; }
    const buttons = ["#email-signin-btn","#email-signup-btn"];
    buttons.forEach(id=>$(id).disabled=true);
    try {
      if (!auth) throw new Error("Firebase Authentication is not ready. Refresh the page and try again.");
      if (action === "signup") await createUserWithEmailAndPassword(auth,email,password);
      else await signInWithEmailAndPassword(auth,email,password);
    } catch(err) {
      console.error("Email/password authentication error:",err);
      const messages = {
        "auth/email-already-in-use":"This email already has an account. Tap Sign in instead.",
        "auth/invalid-email":"Please enter a valid email address.",
        "auth/weak-password":"Choose a stronger password with at least 6 characters.",
        "auth/user-not-found":"No account found for this email. Tap Create account first.",
        "auth/wrong-password":"Incorrect password. Try again or use Forgot password.",
        "auth/invalid-credential":"Email or password is incorrect. Check them or reset your password.",
        "auth/operation-not-allowed":"Email/Password sign-in is not enabled in Firebase Console yet.",
        "auth/too-many-requests":"Too many attempts. Wait a while and try again."
      };
      alert(messages[err.code] || `${err.code || "Error"}: ${err.message || "Please try again."}`);
    } finally { buttons.forEach(id=>$(id).disabled=false); }
  }
  $("#email-signin-btn").addEventListener("click",()=>emailAuth("signin"));
  $("#email-signup-btn").addEventListener("click",()=>emailAuth("signup"));
  $("#reset-password-btn").addEventListener("click",async()=>{
    const email=$("#email-address").value.trim();
    if(!email){alert("Enter your email address first, then tap Forgot password?");return;}
    try { await sendPasswordResetEmail(auth,email); alert("Password reset email sent. Check your inbox and spam folder."); }
    catch(err){ alert(err.code==="auth/user-not-found"?"No account found for this email.":`${err.code || "Error"}: ${err.message}`); }
  });

  $("#signin-btn").addEventListener("click",async()=>{
    const button = $("#signin-btn");
    button.disabled = true;
    button.textContent = "Opening Google…";
    try {
      if (!auth) throw new Error("Firebase Authentication has not initialized. Reload the tracker and try again.");
      const result = await signInWithPopup(auth,new GoogleAuthProvider());
      await connectUser(result.user);
    } catch(err) {
      console.error("Google sign-in error:", err);
      const message = `${err.code || "unknown"}: ${err.message || "Please try again."}`;
      setAccount("Google sign-in failed", message, "sync-warn");
      alert(`Google sign-in failed.\\n\\n${message}`);
    } finally {
      button.disabled = false;
      button.textContent = "Sign in with Google";
    }
  });
  $("#signout-btn").addEventListener("click",async()=>{
    if(!confirm("Sign out of cloud sync on this device? Your cloud records will remain in Firebase."))return;
    try { await signOut(auth); } catch(err){ alert(`Could not sign out: ${err.message}`); }
  });

  loadLocal();
  render();

  try {
    const firebaseApp = initializeApp(firebaseConfig);
    auth = getAuth(firebaseApp);
    db = getFirestore(firebaseApp);
    onAuthStateChanged(auth, user=>connectUser(user));
  } catch(err) {
    console.error(err);
    setAccount("Firebase setup issue", "Your local tracker still works. Check the Firebase configuration and internet connection.", "sync-warn");
  }

  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
    window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
